<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PKTips | Links Oficiais</title>
    <meta
      name="description"
      content="Acesse todos os links oficiais da PKTips em um só lugar."
    />
    <meta property="og:title" content="PKTips | Links Oficiais" />
    <meta
      property="og:description"
      content="Acesse todos os links oficiais da PKTips em um só lugar."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    <style>
      :root {
        --bg-top: #0f172a;
        --bg-bottom: #111827;
        --card: rgba(15, 23, 42, 0.78);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #22c55e;
        --accent-2: #06b6d4;
        --stroke: rgba(148, 163, 184, 0.35);
        --shadow: 0 20px 45px rgba(2, 8, 23, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 650px at -10% -10%, #1e293b 0%, transparent 60%),
          radial-gradient(900px 500px at 120% 20%, #0e7490 0%, transparent 55%),
          linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: 100%;
        max-width: 560px;
        border: 1px solid var(--stroke);
        background: var(--card);
        backdrop-filter: blur(8px);
        border-radius: 24px;
        padding: 26px;
        box-shadow: var(--shadow);
      }

      .brand {
        display: grid;
        place-items: center;
        text-align: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .avatar {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.25);
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0a0f1f;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 32px;
        box-shadow: 0 10px 28px rgba(6, 182, 212, 0.3);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.6rem, 3.5vw, 2rem);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.97rem;
      }

      .links {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .btn {
        text-decoration: none;
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-weight: 600;
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        border-color: rgba(34, 197, 94, 0.7);
        box-shadow: 0 10px 22px rgba(34, 197, 94, 0.2);
      }

      .btn small {
        color: var(--muted);
        font-weight: 500;
        font-size: 0.84rem;
      }

      .social {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .chip {
        color: var(--text);
        text-decoration: none;
        border: 1px solid var(--stroke);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.9rem;
        transition: border-color 0.2s ease, background-color 0.2s ease;
      }

      .chip:hover {
        border-color: rgba(6, 182, 212, 0.8);
        background: rgba(6, 182, 212, 0.15);
      }

      footer {
        margin-top: 20px;
        color: #94a3b8;
        text-align: center;
        font-size: 0.82rem;
      }

      @media (max-width: 480px) {
        .panel {
          padding: 20px;
          border-radius: 20px;
        }

        .btn {
          padding: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel" aria-label="Links oficiais da PKTips">
      <section class="brand">
        <div class="avatar" aria-hidden="true">PK</div>
        <h1>PKTips</h1>
        <p class="subtitle">Seus melhores links em um so lugar.</p>
      </section>

      <section class="links" aria-label="Links principais">
        <a class="btn" href="#" target="_blank" rel="noopener noreferrer">
          <span>Canal VIP</span>
          <small>Acessar</small>
        </a>
        <a class="btn" href="#" target="_blank" rel="noopener noreferrer">
          <span>Entrar no Telegram</span>
          <small>Comunidade</small>
        </a>
        <a class="btn" href="#" target="_blank" rel="noopener noreferrer">
          <span>Instagram Oficial</span>
          <small>@pktips</small>
        </a>
        <a class="btn" href="#" target="_blank" rel="noopener noreferrer">
          <span>Falar no WhatsApp</span>
          <small>Suporte</small>
        </a>
      </section>

      <nav class="social" aria-label="Redes sociais">
        <a class="chip" href="#" target="_blank" rel="noopener noreferrer">YouTube</a>
        <a class="chip" href="#" target="_blank" rel="noopener noreferrer">X / Twitter</a>
        <a class="chip" href="#" target="_blank" rel="noopener noreferrer">TikTok</a>
      </nav>

      <footer>© <span id="year"></span> PKTips. Todos os direitos reservados.</footer>
    </main>

    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
